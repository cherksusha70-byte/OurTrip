<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OurTrip</title>
<!-- Иконки для мобильных -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#02261e">
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Leaflet -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Яндекс Карты: API + плагин для Leaflet -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=e7864472-d690-4c07-b590-23787749977b&lang=ru_RU" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-plugins@3.4.0/layer/tile/Yandex.js"></script>
<style>
/* ... (стили без изменений, как в предыдущей версии) ... */
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
// ... (весь код без изменений, кроме функции doSearch) ...

// ---- MAP PICKER ----
function openMapPicker(target, initialQuery){
  const modalRoot = document.getElementById('modal-root');
  const html = `<div class="modal-overlay" id="picker-overlay" style="z-index:1100">
    <div class="modal" style="max-width:800px">
      <button class="modal-close" id="picker-close">✕</button>
      <h2>Выберите точку на карте</h2>
      <div class="field">
        <label>Поиск адреса</label>
        <input id="picker-search" placeholder="Введите адрес и нажмите Enter" value="${esc(initialQuery||'')}">
      </div>
      <div id="picker-results" class="search-results" style="display:none"></div>
      <div id="picker-map" class="mini-map"></div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">Кликните по карте, чтобы выбрать точку</div>
      <div id="picker-selected" style="margin-top:10px;font-weight:600;color:var(--dark);word-break:break-word"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="picker-cancel" type="button">Отмена</button>
        <button class="btn-primary" id="picker-apply" type="button" disabled>Применить</button>
      </div>
    </div>
  </div>`;
  modalRoot.insertAdjacentHTML('beforeend', html);
  lockBody();

  let selected = null;
  if(mapPicker){ try{ mapPicker.remove(); }catch(e){} }
  mapPicker = L.map('picker-map').setView([55.751244, 37.618423], 10);
  addTileLayer(mapPicker);
  let marker = null;

  mapPicker.on('click', e=>{
    selected = e.latlng;
    if(marker) marker.setLatLng(selected);
    else marker = L.marker(selected).addTo(mapPicker);
    document.getElementById('picker-selected').textContent = `📍 ${selected.lat.toFixed(5)}, ${selected.lng.toFixed(5)}`;
    document.getElementById('picker-apply').disabled = false;
  });

  document.getElementById('picker-close').onclick = closePicker;
  document.getElementById('picker-cancel').onclick = closePicker;
  document.getElementById('picker-overlay').addEventListener('click', e=>{ if(e.target.id==='picker-overlay') closePicker(); });

  // === ИСПРАВЛЕННЫЙ ПОИСК ЧЕРЕЗ ymaps.geocode ===
  async function doSearch(q){
    if(!q) return;
    const resultsEl = document.getElementById('picker-results');
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = '<div class="search-item" style="color:#4a6b66">Поиск…</div>';
    
    try {
      // Ждём полной инициализации Яндекс API
      await new Promise(resolve => ymaps.ready(resolve));
      
      // Выполняем геокодирование
      const res = await ymaps.geocode(q, { results: 5, lang: 'ru_RU' });
      const arr = [];
      
      res.geoObjects.each(obj => {
        const coords = obj.geometry.getCoordinates();
        const text = obj.properties.get('text') || obj.properties.get('name') || 'Без названия';
        arr.push({
          display_name: text,
          lat: coords[0],
          lon: coords[1]
        });
      });
      
      if(!arr.length){
        resultsEl.innerHTML = '<div class="search-item" style="color:#4a6b66">Ничего не найдено</div>';
        return;
      }
      
      resultsEl.innerHTML = arr.map((a,i)=>`<div class="search-item" data-i="${i}">${esc(a.display_name)}</div>`).join('');
      
      resultsEl.querySelectorAll('.search-item').forEach(el=>{
        el.onclick = ()=>{
          const a = arr[Number(el.dataset.i)];
          const lat = a.lat, lng = a.lon;
          mapPicker.setView([lat,lng], 14);
          selected = {lat, lng};
          if(marker) marker.setLatLng(selected);
          else marker = L.marker(selected).addTo(mapPicker);
          document.getElementById('picker-selected').textContent = `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          document.getElementById('picker-apply').disabled = false;
          resultsEl.style.display = 'none';
          const inp = document.getElementById('i-' + (target === 'from' ? 'from-name' : target === 'to' ? 'to-name' : 'addr'));
          if(inp && !inp.value) inp.value = a.display_name;
        };
      });
      
    } catch(e) {
      console.error('Geocode error:', e);
      resultsEl.innerHTML = '<div class="search-item" style="color:#8a2020">Ошибка поиска. Попробуйте ещё раз.</div>';
    }
  }

  const searchInput = document.getElementById('picker-search');
  if(initialQuery) doSearch(initialQuery);
  searchInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); doSearch(searchInput.value.trim()); }
  });

  document.getElementById('picker-apply').onclick = ()=>{
    if(!selected) return;
    let latId, lngId, coordsId;
    if(target === 'from'){ latId='i-from-lat'; lngId='i-from-lng'; coordsId='from-coords'; }
    else if(target === 'to'){ latId='i-to-lat'; lngId='i-to-lng'; coordsId='to-coords'; }
    else { latId='i-lat'; lngId='i-lng'; coordsId='addr-coords'; }
    document.getElementById(latId).value = selected.lat;
    document.getElementById(lngId).value = selected.lng;
    const cEl = document.getElementById(coordsId);
    if(cEl){ cEl.textContent = `📍 ${selected.lat.toFixed(4)}, ${selected.lng.toFixed(4)}`; cEl.classList.add('filled'); }
    closePicker();
  };

  function closePicker(){
    const el = document.getElementById('picker-overlay');
    if(el) el.remove();
    if(mapPicker){ try{ mapPicker.remove(); }catch(e){} mapPicker = null; }
    unlockBody();
  }

  setTimeout(()=>{ try{ mapPicker.invalidateSize(); }catch(e){} }, 150);
}

init();
</script>
</body>
</html>
