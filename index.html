<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OurTrip</title>

<link rel="apple-touch-icon" sizes="180x180" href="/OurTrip/apple-touch-icon.png">

<script src="https://api-maps.yandex.ru/2.1/?apikey=e7864472-d690-4c07-b590-23787749977b&lang=ru_RU" type="text/javascript"></script>

<style>
:root{
  --bg:#f7f9f7; --lime:#92ff5f; --orange:#ff7036; --dark:#0f3b27;
  --teal:#bff2f0; --green:#cff1d2;
  --card:#ffffff; --border:#cff1d2; --muted:#4a6b55; --danger:#d9432f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100vw;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--dark);line-height:1.5;min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
body.modal-open{overflow:hidden}
#app{max-width:1100px;margin:0 auto;padding:20px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:8px 14px;font-size:14px;transition:all .15s}
.btn-primary{background:var(--dark);color:var(--bg);font-weight:500}.btn-primary:hover{background:#0a2c1d}
.btn-teal{background:var(--teal);color:var(--dark);font-weight:500}.btn-teal:hover{background:#a3e3e0}
.btn-ghost{background:transparent;color:var(--muted);padding:6px 10px}.btn-ghost:hover{background:var(--green)}
.btn-danger{background:transparent;color:var(--danger);padding:4px 8px;font-size:16px}.btn-danger:hover{background:#fde8e4}
.btn-icon{background:transparent;color:var(--muted);padding:4px 8px;font-size:16px}.btn-icon:hover{background:var(--green)}
input,select,textarea{
  font-family:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--dark);
  width:100%;max-width:100%;min-width:0;
}
input[type="datetime-local"],input[type="date"],input[type="time"]{
  max-width:100%;min-width:0;width:100%;box-sizing:border-box;
  -webkit-appearance:none;appearance:none;
  -webkit-min-logical-width:0;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(146,255,95,.3)}
input[type=checkbox]{width:auto;accent-color:var(--dark);cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.auth-card{max-width:380px;margin:80px auto;padding:32px}
.auth-card h1{font-size:24px;margin-bottom:8px;color:var(--dark)}
.auth-card p{color:var(--muted);font-size:14px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.header h1{font-size:28px;color:var(--dark);letter-spacing:-0.5px}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.trip-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;position:relative}
.trip-card:hover{border-color:var(--lime);box-shadow:0 6px 20px rgba(15,59,39,.08);transform:translateY(-2px)}
.trip-card h3{font-size:18px;margin-bottom:6px;color:var(--dark);padding-right:30px;word-break:break-word}
.trip-card .dates{font-size:13px;color:var(--muted);margin-bottom:10px}
.trip-card .status-line{font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}
.status-future{background:var(--lime);color:var(--dark)}
.status-active{background:var(--teal);color:var(--dark)}
.status-done{background:var(--green);color:var(--muted)}
.trip-card .total{font-size:15px;font-weight:700;color:var(--dark)}
.trip-card .del{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .15s}
.trip-card:hover .del{opacity:1}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.budget-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0}
.budget-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.budget-card .value{font-size:19px;font-weight:700;color:var(--dark)}
.budget-card.paid{border-color:var(--lime);background:linear-gradient(180deg,#fff 0%,#f1ffee 100%)}
.budget-card.paid .value{color:#2e7a15}
.budget-card.planned{border-color:var(--orange);background:linear-gradient(180deg,#fff 0%,#fff3ed 100%)}
.budget-card.planned .value{color:#c4471a}
.budget-card.budget-card-b{border-color:var(--teal);background:linear-gradient(180deg,#fff 0%,#eaf9f9 100%)}
.budget-card.remain .value{color:#2e7a15}
.budget-card.remain.negative{border-color:var(--orange);background:#fff3ed}
.budget-card.remain.negative .value{color:var(--orange)}
.budget-card[data-editable]{cursor:pointer}
.budget-card[data-editable]:hover{border-color:var(--dark)}
.tabs{
  display:flex;align-items:center;gap:4px;
  border-bottom:2px solid var(--border);margin-bottom:20px;
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
  scrollbar-width:none;
  white-space:nowrap;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:10px 18px;background:transparent;color:var(--muted);
  border-radius:8px 8px 0 0;border-bottom:3px solid transparent;
  font-size:14px;font-weight:600;margin-bottom:-2px;
  flex-shrink:0;white-space:nowrap;
}
.tab:hover{color:var(--dark)}
.tab.active{color:var(--dark);border-bottom-color:var(--dark);background:linear-gradient(180deg,transparent 60%,var(--lime) 100%)}
.trip-header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.trip-header h1{font-size:28px;color:var(--dark);letter-spacing:-0.5px;margin-bottom:6px;word-break:break-word}
.trip-header .dates{color:var(--muted);font-size:14px;margin-bottom:8px}
.trip-header .countdown{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.trip-actions{display:flex;gap:8px;flex-wrap:wrap}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;position:relative}
.item-card .title{font-weight:600;font-size:15px;color:var(--dark);margin-bottom:6px;padding-right:60px;word-break:break-word}
.item-card .meta{font-size:13px;color:var(--muted);margin-bottom:4px;word-break:break-word}
.item-card .meta strong{color:var(--dark)}
.item-card .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.item-card .price{font-weight:700;font-size:16px;color:var(--dark)}
.item-card .actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.item-card .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-paid{background:var(--lime);color:var(--dark)}
.badge-booked{background:var(--teal);color:var(--dark)}
.badge-planned{background:var(--green);color:var(--muted)}
.packing-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.packing-row .info{flex:1;min-width:120px}
.packing-row .info .title{font-weight:600;color:var(--dark);margin-bottom:2px;word-break:break-word}
.packing-row .info .price{font-size:13px;color:var(--muted)}
.packing-row .cb-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.add-btn{width:100%;padding:14px;margin-bottom:20px;background:transparent;border:2px dashed var(--border);color:var(--muted);font-weight:600;border-radius:10px}
.add-btn:hover{border-color:var(--lime);color:var(--dark);background:rgba(146,255,95,.1)}
.calendar-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.calendar-nav h2{font-size:20px;color:var(--dark);text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-header{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:8px 0;text-transform:uppercase}
.cal-day{min-height:70px;padding:6px;border-radius:8px;background:var(--card);border:1px solid transparent;position:relative;cursor:pointer;transition:all .15s;min-width:0}
.cal-day:hover{border-color:var(--lime)}
.cal-day.other-month{opacity:.35}
.cal-day.today{background:var(--lime)}
.cal-day.selected{border-color:var(--dark);box-shadow:0 0 0 2px var(--dark)}
.cal-day .daynum{font-size:13px;font-weight:600;color:var(--dark)}
.cal-day .dots{position:absolute;bottom:6px;left:6px;right:6px;display:flex;gap:3px;flex-wrap:wrap}
.cal-dot{width:6px;height:6px;border-radius:50%}
.dot-transport{background:#0f3b27}
.dot-accommodation{background:#ff7036}
.dot-activities{background:#92ff5f}
.cal-events{margin-top:20px}
.cal-events h3{font-size:16px;margin-bottom:12px;color:var(--dark)}
#map-container{height:500px;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#eaf9f9}
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,59,39,.5);z-index:1000;
  display:flex;align-items:flex-start;justify-content:center;
  padding:20px;overflow-y:auto;
  overscroll-behavior:contain;
}
.modal{
  background:#fff;border-radius:14px;
  max-width:600px;width:100%;
  max-height:calc(100dvh - 40px);
  overflow-y:auto;
  padding:24px;position:relative;
  margin:auto 0;
}
.modal h2{font-size:20px;margin-bottom:20px;color:var(--dark);padding-right:30px;word-break:break-word}
.modal-close{position:absolute;top:12px;right:12px;background:transparent;color:var(--muted);font-size:20px;padding:6px 10px;border-radius:6px;line-height:1}
.modal-close:hover{background:var(--green)}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form-grid>*{min-width:0}
.addr-group{background:#f7fbf7;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px}
.addr-group .group-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px;letter-spacing:.5px}
.addr-row{display:flex;gap:8px;align-items:stretch}
.addr-row input{flex:1;min-width:0}
.map-btn{background:var(--teal);color:var(--dark);padding:6px 10px;font-size:12px;font-weight:600;border-radius:6px;white-space:nowrap;flex-shrink:0}
.map-btn:hover{background:#a3e3e0}
.coords-line{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-word}
.coords-line.filled{color:#2e7a15;font-weight:600}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.mini-map{height:340px;width:100%;border-radius:8px;margin:12px 0;background:#eaf9f9}
.search-results{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px;-webkit-overflow-scrolling:touch}
.search-item{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);word-break:break-word}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:var(--lime)}
.notes-panel{margin-bottom:20px}
.notes-area{width:100%;min-height:150px;font-family:inherit;resize:vertical}
.loading{text-align:center;padding:60px;color:var(--muted)}
.error{background:#fff3ed;color:#a8381a;padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:14px;border:1px solid var(--orange)}

/* ============ MOBILE ============ */
@media(max-width:600px){
  #app{padding:12px}
  .header h1{font-size:24px}
  .header>div{display:flex;gap:6px;flex-wrap:wrap}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .budget{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .budget-card{padding:12px}
  .budget-card .value{font-size:17px}
  .modal-overlay{padding:8px;align-items:flex-start}
  .modal{max-height:calc(100dvh - 16px);padding:18px 14px;border-radius:12px}
  .cal-day{min-height:52px;padding:4px}
  .cal-day .daynum{font-size:11px}
  .cal-dot{width:5px;height:5px}
  #map-container{height:60vh}
  .mini-map{height:50vh}
  .trip-header h1{font-size:22px}
  .trip-actions{width:100%}
  .trip-actions button{flex:1}
  .btn-icon{padding:8px 10px;font-size:18px}
  .btn-danger{padding:6px 10px;font-size:16px}
  input,select,textarea{font-size:16px}
  .item-card .title{padding-right:80px}
  .item-card .actions{top:8px;right:8px}
  .map-btn{padding:8px 12px;font-size:13px}
}
</style>
</head>
<body>

<script>
const SUPABASE_URL = 'https://tmwdinfnjqsqjjgchppd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtd2RpbmZuanFzcWpqZ2NocHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDE2MTYsImV4cCI6MjEwNTQ3NzYxNn0.wiCmdqDw0BsXFN9O8KOiOC6WFHmm7qDN8lYtTnKFELw';
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = [
  { id:'transport', label:'Дорога' },
  { id:'accommodation', label:'Жильё' },
  { id:'activities', label:'Активности' },
  { id:'packing', label:'Чемодан' },
  { id:'calendar', label:'Календарь' },
  { id:'map', label:'Карта' }
];
const TRANSPORT_TYPES = ['Самолёт','Поезд','Автобус','Автомобиль','Паром','Другое'];
const ACC_STATUSES = [
  { id:'planned', label:'В планах' },
  { id:'booked', label:'Забронировано' },
  { id:'paid', label:'Оплачено' }
];

const state = {
  user:null, loading:true,
  trips:[], currentTrip:null, items:[],
  activeTab:'transport',
  calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  selectedDay: null,
  showNotes: false,
  modal: null
};
let mapPicker = null, mainMap = null;

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => (Number(n)||0).toLocaleString('ru-RU')+' ₽';
const fmtDate = d => d ? new Date(d).toLocaleDateString('ru-RU') : '';
const fmtDateTime = d => d ? new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const toLocalInput = iso => {
  if(!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fromLocalInput = v => v ? new Date(v).toISOString() : null;

function isPaid(item){
  if(item.category === 'packing') return item.data?.bought === true;
  return item.status === 'paid';
}

function tripStatus(trip){
  const today = new Date(); today.setHours(0,0,0,0);
  if(!trip.start_date && !trip.end_date) return { text:'Даты не указаны', cls:'status-done' };
  const start = trip.start_date ? new Date(trip.start_date) : null;
  const end = trip.end_date ? new Date(trip.end_date) : null;
  if(start && today < start){
    const days = Math.ceil((start - today)/86400000);
    return { text: days===0?'Сегодня начало!':`До поездки: ${days} ${decl(days,'день','дня','дней')}`, cls:'status-future' };
  }
  if(end && today > end){
    return { text:'Завершена', cls:'status-done' };
  }
  if(end){
    const days = Math.ceil((end - today)/86400000);
    return { text: days===0?'Последний день!':`До возвращения: ${days} ${decl(days,'день','дня','дней')}`, cls:'status-active' };
  }
  return { text:'Идёт', cls:'status-active' };
}
function decl(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

// ---- AUTH ----
async function init(){
  const { data:{ session } } = await db.auth.getSession();
  state.user = session?.user || null;
  state.loading = false;
  if(state.user) await loadTrips();
  render();
  subscribeRealtime();
  db.auth.onAuthStateChange(async (_e, session)=>{
    state.user = session?.user || null;
    if(state.user){ await loadTrips(); } else { state.trips=[]; state.currentTrip=null; state.items=[]; }
    render();
  });
}
async function signIn(email,password){
  state.error=null;
  const { error } = await db.auth.signInWithPassword({email,password});
  if(error){ state.error = trErr(error.message); render(); }
}
async function signOut(){ await db.auth.signOut(); }
function trErr(m){
  if(m.includes('Invalid login credentials')) return 'Неверный email или пароль';
  if(m.includes('Email not confirmed')) return 'Email не подтверждён';
  return m;
}

// ---- DATA ----
async function loadTrips(){
  const { data } = await db.from('trips').select('*').order('created_at',{ascending:false});
  state.trips = data || [];
}
async function loadItems(tripId){
  const { data } = await db.from('items').select('*').eq('trip_id',tripId).order('created_at',{ascending:true});
  state.items = data || [];
}
async function createTrip(name, startDate, endDate){
  const { data, error } = await db.from('trips').insert({
    name, start_date:startDate||null, end_date:endDate||null, created_by:state.user.id
  }).select().single();
  if(error){ alert('Ошибка: '+error.message); return; }
  state.trips.unshift(data); render();
}
async function updateTrip(id, patch){
  const { error } = await db.from('trips').update(patch).eq('id',id);
  if(error){ alert('Ошибка: '+error.message); return; }
  const t = state.trips.find(t=>t.id===id);
  if(t) Object.assign(t, patch);
  if(state.currentTrip?.id === id) Object.assign(state.currentTrip, patch);
  render();
}
async function deleteTrip(id){
  if(!confirm('Удалить поездку со всеми данными?')) return;
  await db.from('trips').delete().eq('id',id);
  state.trips = state.trips.filter(t=>t.id!==id);
  if(state.currentTrip?.id===id){ state.currentTrip=null; state.items=[]; }
  render();
}
async function openTrip(id){
  state.currentTrip = state.trips.find(t=>t.id===id);
  state.activeTab = 'transport';
  state.showNotes = false;
  await loadItems(id);
  render();
}
async function saveItem(item){
  if(item.id){
    const { id, ...patch } = item;
    const { error } = await db.from('items').update(patch).eq('id',id);
    if(error){ alert('Ошибка: '+error.message); return false; }
  } else {
    const { error } = await db.from('items').insert(item);
    if(error){ alert('Ошибка: '+error.message); return false; }
  }
  await loadItems(state.currentTrip.id);
  return true;
}
async function deleteItem(id){
  if(!confirm('Удалить?')) return;
  await db.from('items').delete().eq('id',id);
  state.items = state.items.filter(i=>i.id!==id);
  render();
}
async function saveNotes(tripId, notes){
  await db.from('trips').update({notes}).eq('id',tripId);
  const t = state.trips.find(t=>t.id===tripId);
  if(t) t.notes = notes;
  if(state.currentTrip?.id===tripId) state.currentTrip.notes = notes;
}

// ---- REALTIME ----
function subscribeRealtime(){
  db.channel('db-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'trips'},async()=>{
      await loadTrips();
      if(state.currentTrip){
        const fresh = state.trips.find(t=>t.id===state.currentTrip.id);
        if(fresh) state.currentTrip = fresh;
      }
      if(!state.modal) render();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'items'},async(payload)=>{
      if(state.currentTrip && (payload.new?.trip_id===state.currentTrip.id || payload.old?.trip_id===state.currentTrip.id)){
        if(state.modal) return;
        await loadItems(state.currentTrip.id);
        render();
      }
    })
    .subscribe();
}

// ---- MAPS ----
function addTileLayer(map){
  try{
    const yandexLayer = L.yandex('yandex#map').addTo(map);
    yandexLayer.on('tileerror', function(){
      console.warn('Yandex tiles error, switching to OSM');
      try{ map.removeLayer(yandexLayer); }catch(e){}
      if(!map._osmFallback){
        map._osmFallback = true;
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);
      }
    });
  }catch(err){
    console.error('Yandex layer init failed:', err);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
  }
}

// ---- RENDER ----
function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = '<div class="loading">Загрузка…</div>'; return; }
  if(!state.user){ app.innerHTML = renderLogin(); bindLogin(); return; }
  if(!state.currentTrip){ app.innerHTML = renderTripsList(); bindTripsList(); return; }
  app.innerHTML = renderTripDetail(); bindTripDetail();
}

function renderLogin(){
  return `<div class="card auth-card">
    <h1>OurTrip</h1>
    <p>Войдите, чтобы продолжить</p>
    ${state.error?`<div class="error">${esc(state.error)}</div>`:''}
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Пароль</label><input type="password" name="password" required></div>
      <button type="submit" class="btn-primary" style="width:100%">Войти</button>
    </form>
  </div>`;
}
function bindLogin(){
  document.getElementById('login-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    await signIn(fd.get('email'), fd.get('password'));
  });
}

function renderTripsList(){

    <h1>OurTrip</h1>
    <div>
      <button class="btn-ghost" id="logout-btn">Выйти</button>
      <button class="btn-primary" id="new-trip-btn">+ Новая поездка</button>
    </div>

  ${state.trips.length===0?'<div class="empty">Пока нет ни одной поездки.<br>Создайте первую!</div>':`
  <div class="trip-grid">
    ${state.trips.map(t=>{
      const st = tripStatus(t);
      return `<div class="trip-card" data-id="${t.id}">
        <button class="btn-danger del" data-del="${t.id}">✕</button>
        <h3>${esc(t.name)}</h3>
        <div class="dates">${t.start_date||t.end_date?`${fmtDate(t.start_date)}${t.end_date?' — '+fmtDate(t.end_date):''}`:'Даты не указаны'}</div>
        ${st.text?`<div class="status-line ${st.cls}">${esc(st.text)}</div>`:''}
        <div class="total" data-total="${t.id}">…</div>
      </div>`;
    }).join('')}
  </div>`}`;
}
async function bindTripsList(){
  document.getElementById('logout-btn').addEventListener('click', signOut);
  document.getElementById('new-trip-btn').addEventListener('click', ()=> openTripModal(null));
  document.querySelectorAll('.trip-card').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.dataset.del) return;
      openTrip(el.dataset.id);
    });
  });
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); deleteTrip(b.dataset.del); });
  });
  const { data } = await db.from('items').select('trip_id, price');
  const totals = {};
  (data||[]).forEach(i=>{ totals[i.trip_id]=(totals[i.trip_id]||0)+Number(i.price||0); });
  state.trips.forEach(t=>{
    const el = document.querySelector(`[data-total="${t.id}"]`);
    if(el) el.textContent = 'Всего: '+fmtMoney(totals[t.id]||0);
  });
}

function renderTripDetail(){
  const t = state.currentTrip;
  const st = tripStatus(t);

  const budget = Number(t.budget||0);
  const remain = budget - total;

  return `<button class="btn-ghost back-btn" id="back-btn" style="margin-bottom:16px">← Все поездки</button>
  <div class="trip-header">
    <div>
      <h1>${esc(t.name)}</h1>
      <div class="dates">${t.start_date||t.end_date?`${fmtDate(t.start_date)}${t.end_date?' — '+fmtDate(t.end_date):''}`:'Даты не указаны'}</div>
      ${st.text?`<div class="countdown ${st.cls}">${esc(st.text)}</div>`:''}
    </div>
    <div class="trip-actions">
      <button class="btn-teal" id="notes-btn">${state.showNotes?'Скрыть заметки':'📝 Заметки'}</button>
      <button class="btn-ghost" id="edit-trip-btn">✎ Изменить</button>
    </div>
  </div>

  ${state.showNotes?`<div class="notes-panel card">
    <div class="field"><label>Заметки о поездке</label>

  </div>`:''}

  <div class="budget">
    <div class="budget-card"><div class="label">Итог</div><div class="value">${fmtMoney(total)}</div></div>
    <div class="budget-card paid"><div class="label">Оплачено</div><div class="value">${fmtMoney(paid)}</div></div>
    <div class="budget-card planned"><div class="label">Планируется</div><div class="value">${fmtMoney(planned)}</div></div>
    <div class="budget-card budget-card-b" data-editable="budget" title="Нажмите, чтобы задать бюджет"><div class="label">Бюджет</div><div class="value">${budget>0?fmtMoney(budget):'— задать'}</div></div>
    <div class="budget-card remain ${remain<0?'negative':''}" data-editable="budget"><div class="label">${remain<0?'Перерасход':'Остаток'}</div><div class="value">${budget>0?fmtMoney(Math.abs(remain)):'—'}</div></div>

function renderTabContent(){
  const tab = state.activeTab;
  if(tab === 'calendar') return renderCalendar();
  if(tab === 'map') return renderMapView();
  if(tab === 'packing') return renderPackingList();
  return renderItemsList(tab);

function renderItemsList(category){
  const items = state.items.filter(i=>i.category===category);
  return `<button class="add-btn" data-add="${category}">+ Добавить</button>
  ${items.length===0?'<div class="empty" style="padding:30px">Здесь пока пусто</div>':items.map(i=>renderItemCard(i)).join('')}`;

function renderItemCard(i){
  const cat = i.category;
  let meta = '';
  let statusBadge = '';
  if(cat === 'transport'){
    const d = i.data || {};
    meta = `
      <div class="meta"><strong>${esc(d.type||'Транспорт')}${d.number?' '+esc(d.number):''}</strong></div>
      <div class="meta">Отбытие: ${esc(d.from_name||'—')} · ${fmtDateTime(i.event_start)}</div>
      <div class="meta">Прибытие: ${esc(d.to_name||'—')} · ${fmtDateTime(i.event_end)}</div>`;
    statusBadge = isPaid(i)?'<span class="badge badge-paid">Оплачено</span>':'<span class="badge badge-planned">Не оплачено</span>';
  } else if(cat === 'accommodation'){
    const d = i.data || {};
    const stl = ACC_STATUSES.find(s=>s.id===i.status)?.label || 'В планах';
    const bcls = i.status==='paid'?'badge-paid':i.status==='booked'?'badge-booked':'badge-planned';
    meta = `
      <div class="meta">${esc(d.address||'Адрес не указан')}</div>
      <div class="meta">Заезд: ${fmtDateTime(i.event_start)}</div>
      <div class="meta">Выезд: ${fmtDateTime(i.event_end)}</div>
      ${d.notes?`<div class="meta" style="margin-top:6px;font-style:italic">${esc(d.notes)}</div>`:''}`;
    statusBadge = `<span class="badge ${bcls}">${stl}</span>`;
  } else if(cat === 'activities'){
    const d = i.data || {};
    meta = `
      <div class="meta">${esc(d.address||'Адрес не указан')}</div>
      <div class="meta">Когда: ${fmtDateTime(i.event_start)}</div>
      ${d.notes?`<div class="meta" style="margin-top:6px;font-style:italic">${esc(d.notes)}</div>`:''}`;
    statusBadge = isPaid(i)?'<span class="badge badge-paid">Оплачено</span>':'<span class="badge badge-planned">Не оплачено</span>';
  }
  return `<div class="item-card">
    <div class="actions">
      <button class="btn-icon" data-edit="${i.id}" title="Редактировать">✎</button>
      <button class="btn-icon" data-delete="${i.id}" title="Удалить">✕</button>
    </div>
    <div class="title">${esc(i.title)}</div>

function renderCalendar(){
  const y = state.calendarMonth.getFullYear();
  const m = state.calendarMonth.getMonth();
  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);
  const startDay = (first.getDay()+6)%7;
  const daysInMonth = last.getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  const dayItems = {};
  state.items.forEach(i=>{
    if(!i.event_start) return;
    const start = new Date(i.event_start);
    const end = i.event_end ? new Date(i.event_end) : start;
    const d = new Date(start.getFullYear(),start.getMonth(),start.getDate());
    const endD = new Date(end.getFullYear(),end.getMonth(),end.getDate());
    while(d <= endD){
      const key = d.toDateString();
      if(!dayItems[key]) dayItems[key] = [];
      dayItems[key].push(i);
      d.setDate(d.getDate()+1);
    }
  });

  let cells = '';
  const prevLast = new Date(y,m,0).getDate();
  for(let i=startDay-1;i>=0;i--){
    cells += `<div class="cal-day other-month"><div class="daynum">${prevLast-i}</div></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y,m,d);
    const key = date.toDateString();
    const isToday = date.getTime()===today.getTime();
    const isSel = state.selectedDay && new Date(state.selectedDay).toDateString()===key;
    const evs = dayItems[key] || [];
    const dots = evs.slice(0,4).map(e=>{
      const cls = e.category==='transport'?'dot-transport':e.category==='accommodation'?'dot-accommodation':'dot-activities';
      return `<span class="cal-dot ${cls}"></span>`;
    }).join('');
    cells += `<div class="cal-day ${isToday?'today':''} ${isSel?'selected':''}" data-day="${date.toISOString()}">
      <div class="daynum">${d}</div>
      <div class="dots">${dots}</div>
    </div>`;
  }
  const remaining = (7 - ((startDay+daysInMonth)%7))%7;
  for(let i=1;i<=remaining;i++){
    cells += `<div class="cal-day other-month"><div class="daynum">${i}</div></div>`;
  }

  let eventsHtml = '';
  if(state.selectedDay){
    const key = new Date(state.selectedDay).toDateString();
    const evs = (dayItems[key]||[]).sort((a,b)=>new Date(a.event_start)-new Date(b.event_start));
    eventsHtml = `<div class="cal-events">
      <h3>${new Date(state.selectedDay).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</h3>
      ${evs.length===0?'<div class="empty" style="padding:20px">Событий нет</div>':evs.map(i=>{
        const time = i.event_start?new Date(i.event_start).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
        const cat = CATEGORIES.find(c=>c.id===i.category)?.label || '';
        return `<div class="item-card" style="margin-bottom:8px">
          <div class="title">${esc(i.title)}</div>
          <div class="meta">${cat}${time?' · '+time:''}</div>
          <div class="row"><div class="price">${fmtMoney(i.price)}</div></div>
        </div>`;
      }).join('')}
    </div>`;
  }

  return `<div class="card">
    <div class="calendar-nav">
      <button class="btn-ghost" id="cal-prev">←</button>
      <h2>${monthNames[m]} ${y}</h2>
      <button class="btn-ghost" id="cal-next">→</button>
    </div>
    <div class="cal-grid">
      ${dayNames.map(d=>`<div class="cal-header">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  ${eventsHtml}`;
}

function renderMapView(){
  const points = state.items.filter(i=>{
    const d = i.data||{};
    return (d.lat && d.lng) || (d.from_lat && d.from_lng) || (d.to_lat && d.to_lng);
  });
  if(points.length===0){
    return '<div class="empty" style="padding:60px">Пока нет точек на карте.<br>Добавьте адрес к дороге, жилью или активностям.</div>';
  }
  return `<div id="map-container"></div>`;
}

function bindTripDetail(){
  document.getElementById('back-btn').addEventListener('click', ()=>{
    state.currentTrip=null; state.items=[]; state.showNotes=false; render();
  });
  document.getElementById('notes-btn').addEventListener('click', ()=>{ state.showNotes=!state.showNotes; render(); });
  document.getElementById('edit-trip-btn').addEventListener('click', ()=> openTripModal(state.currentTrip));

  document.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.activeTab = el.dataset.tab;
      state.selectedDay = null;
      render();
    });
  });

  document.querySelectorAll('[data-editable="budget"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const cur = state.currentTrip.budget || 0;
      const v = prompt('Бюджет поездки (в рублях):', cur);
      if(v === null) return;
      const num = Number(v.replace(/\s/g,'').replace(',','.')) || 0;
      await updateTrip(state.currentTrip.id, { budget: num });
    });
  });

  if(state.showNotes){
    const ta = document.getElementById('notes-area');
    let timer;
    ta.addEventListener('input', ()=>{
      clearTimeout(timer);
      timer = setTimeout(()=>saveNotes(state.currentTrip.id, ta.value), 800);
    });
  }

  document.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click', ()=> openItemModal(b.dataset.add, null));
  });
  document.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = state.items.find(i=>i.id===b.dataset.edit);
      if(item) openItemModal(item.category, item);
    });
  });
  document.querySelectorAll('[data-delete]').forEach(b=>{
    b.addEventListener('click', ()=> deleteItem(b.dataset.delete));
  });
  document.querySelectorAll('[data-pack-toggle]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const item = state.items.find(i=>i.id===cb.dataset.id);
      if(!item) return;
      const field = cb.dataset.packToggle;
      const data = {...(item.data||{}), [field]: cb.checked};
      item.data = data;
      await db.from('items').update({data}).eq('id',item.id);
      const total = state.items.reduce((s,i)=>s+Number(i.price||0),0);
      const paid = state.items.filter(isPaid).reduce((s,i)=>s+Number(i.price||0),0);
      updateBudgetDisplay(total, paid);
    });
  });

  const prev = document.getElementById('cal-prev');
  const next = document.getElementById('cal-next');
  if(prev) prev.addEventListener('click', ()=>{ state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth()-1, 1); render(); });
  if(next) next.addEventListener('click', ()=>{ state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth()+1, 1); render(); });
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.selectedDay = el.dataset.day; render(); });
  });

  if(state.activeTab === 'map') initMainMap();
}

function updateBudgetDisplay(total, paid){
  const t = state.currentTrip;
  const planned = total - paid;
  const budget = Number(t.budget||0);
  const remain = budget - total;
  const cards = document.querySelectorAll('.budget-card');
  if(cards.length >= 5){
    cards[0].querySelector('.value').textContent = fmtMoney(total);
    cards[1].querySelector('.value').textContent = fmtMoney(paid);
    cards[2].querySelector('.value').textContent = fmtMoney(planned);
    if(budget>0){
      cards[4].querySelector('.value').textContent = fmtMoney(Math.abs(remain));
      cards[4].classList.toggle('negative', remain<0);
      cards[4].querySelector('.label').textContent = remain<0?'Перерасход':'Остаток';
    }
  }
}

function initMainMap(){
  const container = document.getElementById('map-container');
  if(!container) return;
  const points = [];
  state.items.forEach(i=>{
    const d = i.data||{};
    const cat = i.category;
    if(d.lat && d.lng) points.push({lat:d.lat, lng:d.lng, label:i.title, cat});
    if(d.from_lat && d.from_lng) points.push({lat:d.from_lat, lng:d.from_lng, label:(d.from_name||i.title)+' (отправление)', cat:'transport'});
    if(d.to_lat && d.to_lng) points.push({lat:d.to_lat, lng:d.to_lng, label:(d.to_name||i.title)+' (прибытие)', cat:'transport'});
  });
  if(mainMap){ try{ mainMap.remove(); }catch(e){} mainMap = null; }
  try{
    mainMap = L.map(container).setView([points[0].lat, points[0].lng], 4);
    addTileLayer(mainMap);
    const colors = {transport:'#0f3b27', accommodation:'#ff7036', activities:'#92ff5f'};
    const bounds = [];
    points.forEach(p=>{
      const marker = L.circleMarker([p.lat, p.lng], {radius:9, color:'#fff', weight:2, fillColor:colors[p.cat]||'#0f3b27', fillOpacity:1}).addTo(mainMap);
      marker.bindPopup(`<strong>${esc(p.label)}</strong>`);
      bounds.push([p.lat, p.lng]);
    });
    if(bounds.length>1) mainMap.fitBounds(bounds, {padding:[40,40]});
    setTimeout(()=>{ try{ mainMap.invalidateSize(); }catch(e){} }, 100);
  }catch(err){
    console.error('Map error:', err);
    container.innerHTML = '<div style="padding:40px;text-align:center;color:#4a6b55">Не удалось загрузить карту. Проверьте интернет или попробуйте позже.</div>';
  }
}

// ---- MODALS ----
function lockBody(){ document.body.classList.add('modal-open'); }
function unlockBody(){
  if(!document.querySelector('.modal-overlay')) document.body.classList.remove('modal-open');
}

function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
  state.modal = null;
  if(mapPicker){ try{ mapPicker.remove(); }catch(e){} mapPicker = null; }
  unlockBody();
  render();
}

function openTripModal(trip){
  const isEdit = !!trip;
  const t = trip || { name:'', start_date:'', end_date:'' };
  const startVal = t.start_date || '';
  const endVal = t.end_date || '';
  const html = `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <h2>${isEdit?'Изменить поездку':'Новая поездка'}</h2>
      <div class="field"><label>Название</label><input id="t-name" value="${esc(t.name)}" autofocus></div>
      <div class="form-grid">
        <div class="field"><label>Дата начала</label><input id="t-start" type="date" value="${startVal}"></div>
        <div class="field"><label>Дата окончания</label><input id="t-end" type="date" value="${endVal}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal-cancel">Отмена</button>
        <button class="btn-primary" id="modal-save">${isEdit?'Сохранить':'Создать'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
  lockBody();
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('modal-save').onclick = async ()=>{
    const name = document.getElementById('t-name').value.trim();
    if(!name){ alert('Введите название'); return; }
    const start = document.getElementById('t-start').value || null;
    const end = document.getElementById('t-end').value || null;
    if(isEdit){
      await updateTrip(t.id, {name, start_date:start, end_date:end});
      closeModal();
    } else {
      await createTrip(name, start, end);
      closeModal();
    }
  };
  document.getElementById('t-name').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('modal-save').click(); });
}

        <input type="hidden" id="i-to-lng" value="${d.to_lng||''}">
        <div class="coords-line ${d.to_lat?'filled':''}" id="to-coords">${d.to_lat?`📍 ${Number(d.to_lat).toFixed(4)}, ${Number(d.to_lng).toFixed(4)}`:'точка не выбрана'}</div>
        <div class="field" style="margin-top:10px"><label>Дата и время прибытия</label><input id="i-end" type="datetime-local" value="${toLocalInput(i.event_end)}"></div>

      </div>
      <input type="hidden" id="i-lat" value="${d.lat||''}">
      <input type="hidden" id="i-lng" value="${d.lng||''}">
      <div class="coords-line ${d.lat?'filled':''}" id="addr-coords">${d.lat?`📍 ${Number(d.lat).toFixed(4)}, ${Number(d.lng).toFixed(4)}`:'точка не выбрана'}</div>
      <div class="form-grid">
        <div class="field"><label>Дата и время заезда</label><input id="i-start" type="datetime-local" value="${toLocalInput(i.event_start)}"></div>
        <div class="field"><label>Дата и время выезда</label><input id="i-end" type="datetime-local" value="${toLocalInput(i.event_end)}"></div>
      </div>
      <div class="form-grid">

      <div class="field"><label>Название</label><input id="i-title" value="${esc(i.title)}" placeholder="Лувр" autofocus></div>
      <div class="field"><label>Адрес / точка на карте</label>
        <div class="addr-row"><input id="i-addr" value="${esc(d.address||'')}" placeholder="Rue de Rivoli, Париж"><button class="map-btn" data-picker="addr" type="button">🗺 карта</button></div>
      </div>
      <input type="hidden" id="i-lat" value="${d.lat||''}">
      <input type="hidden" id="i-lng" value="${d.lng||''}">
      <div class="coords-line ${d.lat?'filled':''}" id="addr-coords">${d.lat?`📍 ${Number(d.lat).toFixed(4)}, ${Number(d.lng).toFixed(4)}`:'точка не выбрана'}</div>
      <div class="field"><label>Дата и время</label><input id="i-start" type="datetime-local" value="${toLocalInput(i.event_start)}"></div>

        <div class="field"><label>Стоимость</label><input id="i-price" type="number" min="0" step="0.01" value="${i.price||0}"></div>

      </div>
    </div>
  </div>`;
  state.modal = {category, item};
  document.getElementById('modal-root').innerHTML = html;
  lockBody();
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('modal-save').onclick = async ()=>{
    const ok = await saveItemFromModal(category, item);
    if(ok) closeModal();
  };

  document.querySelectorAll('[data-picker]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const which = b.dataset.picker;
      const title = document.getElementById('i-title').value.trim();
      const addrInput = which === 'from' ? document.getElementById('i-from-name') : which === 'to' ? document.getElementById('i-to-name') : document.getElementById('i-addr');
      openMapPicker(which, addrInput?.value || title);
    });
  });
}

async function saveItemFromModal(category, existing){
  const title = document.getElementById('i-title').value.trim();
  if(!title){ alert('Введите название'); return false; }
  const price = Number(document.getElementById('i-price').value) || 0;
  const base = { trip_id: state.currentTrip.id, category, title, price };

  if(category === 'transport'){
    const type = document.getElementById('i-type').value;
    const number = document.getElementById('i-number').value.trim();
    const from_name = document.getElementById('i-from-name').value.trim();
    const to_name = document.getElementById('i-to-name').value.trim();
    const from_lat = parseFloat(document.getElementById('i-from-lat').value) || null;
    const from_lng = parseFloat(document.getElementById('i-from-lng').value) || null;
    const to_lat = parseFloat(document.getElementById('i-to-lat').value) || null;
    const to_lng = parseFloat(document.getElementById('i-to-lng').value) || null;
    const event_start = fromLocalInput(document.getElementById('i-start').value);
    const event_end = fromLocalInput(document.getElementById('i-end').value);
    const paid = document.getElementById('i-paid').checked;
    Object.assign(base, {
      status: paid ? 'paid' : 'planned',
      event_start, event_end,
      data: { type, number, from_name, from_lat, from_lng, to_name, to_lat, to_lng }
    });
  } else if(category === 'accommodation'){
    const address = document.getElementById('i-addr').value.trim();
    const lat = parseFloat(document.getElementById('i-lat').value) || null;
    const lng = parseFloat(document.getElementById('i-lng').value) || null;
    const notes = document.getElementById('i-notes').value.trim();
    const event_start = fromLocalInput(document.getElementById('i-start').value);
    const event_end = fromLocalInput(document.getElementById('i-end').value);
    const status = document.getElementById('i-status').value;
    Object.assign(base, { status, event_start, event_end, data: { address, lat, lng, notes } });
  } else if(category === 'activities'){
    const address = document.getElementById('i-addr').value.trim();
    const lat = parseFloat(document.getElementById('i-lat').value) || null;
    const lng = parseFloat(document.getElementById('i-lng').value) || null;
    const notes = document.getElementById('i-notes').value.trim();
    const event_start = fromLocalInput(document.getElementById('i-start').value);
    const paid = document.getElementById('i-paid').checked;
    Object.assign(base, {
      status: paid ? 'paid' : 'planned',
      event_start, event_end: event_start,
      data: { address, lat, lng, notes }
    });
  } else if(category === 'packing'){
    const bought = document.getElementById('i-bought').checked;
    const packed = document.getElementById('i-packed').checked;
    Object.assign(base, { status: bought?'paid':'planned', data: { bought, packed } });
  }

  if(existing?.id) base.id = existing.id;
  const ok = await saveItem(base);
  if(ok) render();
  return ok;
}

// ---- MAP PICKER ----
function openMapPicker(target, initialQuery){
  const modalRoot = document.getElementById('modal-root');
  const html = `<div class="modal-overlay" id="picker-overlay" style="z-index:1100">
    <div class="modal" style="max-width:800px">
      <button class="modal-close" id="picker-close">✕</button>
      <h2>Выберите точку на карте</h2>
      <div class="field">
        <label>Поиск адреса</label>
        <input id="picker-search" placeholder="Введите адрес и нажмите Enter" value="${esc(initialQuery||'')}">
      </div>
      <div id="picker-results" class="search-results" style="display:none"></div>
      <div id="picker-map" class="mini-map"></div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">Кликните по карте, чтобы выбрать точку</div>
      <div id="picker-selected" style="margin-top:10px;font-weight:600;color:var(--dark);word-break:break-word"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="picker-cancel" type="button">Отмена</button>
        <button class="btn-primary" id="picker-apply" type="button" disabled>Применить</button>
      </div>
    </div>
  </div>`;
  modalRoot.insertAdjacentHTML('beforeend', html);
  lockBody();

  let selected = null;
  if(mapPicker){ try{ mapPicker.remove(); }catch(e){} }
  mapPicker = L.map('picker-map').setView([55.751244, 37.618423], 10);
  addTileLayer(mapPicker);
  let marker = null;

  mapPicker.on('click', e=>{
    selected = e.latlng;
    if(marker) marker.setLatLng(selected);
    else marker = L.marker(selected).addTo(mapPicker);
    document.getElementById('picker-selected').textContent = `📍 ${selected.lat.toFixed(5)}, ${selected.lng.toFixed(5)}`;
    document.getElementById('picker-apply').disabled = false;
  });

  document.getElementById('picker-close').onclick = closePicker;
  document.getElementById('picker-cancel').onclick = closePicker;
  document.getElementById('picker-overlay').addEventListener('click', e=>{ if(e.target.id==='picker-overlay') closePicker(); });

  // Поиск через Nominatim (OpenStreetMap) — бесплатно, без ключей, поддерживает CORS
  async function doSearch(q){
    if(!q) return;
    const resultsEl = document.getElementById('picker-results');
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = '<div class="search-item" style="color:#4a6b55">Поиск…</div>';
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=1&accept-language=ru&q=' + encodeURIComponent(q);
      const response = await fetch(url, {
        headers: {
          'Accept': 'application/json'
        }
      });
      if(!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();

      if(!data.length){
        resultsEl.innerHTML = '<div class="search-item" style="color:#4a6b55">Ничего не найдено</div>';
        return;
      }

      const arr = data.map(item => ({
        display_name: item.display_name,
        lat: parseFloat(item.lat),
        lon: parseFloat(item.lon)
      })).filter(a => !isNaN(a.lat) && !isNaN(a.lon));

      resultsEl.innerHTML = arr.map((a,i)=>`<div class="search-item" data-i="${i}">${esc(a.display_name)}</div>`).join('');

      resultsEl.querySelectorAll('.search-item').forEach(el=>{
        el.onclick = ()=>{
          const a = arr[Number(el.dataset.i)];
          const lat = a.lat, lng = a.lon;
          mapPicker.setView([lat,lng], 14);
          selected = {lat, lng};
          if(marker) marker.setLatLng(selected);
          else marker = L.marker(selected).addTo(mapPicker);
          document.getElementById('picker-selected').textContent = `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          document.getElementById('picker-apply').disabled = false;
          resultsEl.style.display = 'none';
          const inp = document.getElementById('i-' + (target === 'from' ? 'from-name' : target === 'to' ? 'to-name' : 'addr'));
          if(inp && !inp.value) inp.value = a.display_name;
        };
      });
    } catch(e) {
      console.error('Geocode error:', e);
      resultsEl.innerHTML = '<div class="search-item" style="color:#a8381a">Ошибка поиска. Попробуйте ещё раз.</div>';
    }
  }

  const searchInput = document.getElementById('picker-search');
  if(initialQuery) doSearch(initialQuery);
  searchInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); doSearch(searchInput.value.trim()); }
  });

  document.getElementById('picker-apply').onclick = ()=>{
    if(!selected) return;
    let latId, lngId, coordsId;
    if(target === 'from'){ latId='i-from-lat'; lngId='i-from-lng'; coordsId='from-coords'; }
    else if(target === 'to'){ latId='i-to-lat'; lngId='i-to-lng'; coordsId='to-coords'; }
    else { latId='i-lat'; lngId='i-lng'; coordsId='addr-coords'; }
    document.getElementById(latId).value = selected.lat;
    document.getElementById(lngId).value = selected.lng;
    const cEl = document.getElementById(coordsId);
    if(cEl){ cEl.textContent = `📍 ${selected.lat.toFixed(4)}, ${selected.lng.toFixed(4)}`; cEl.classList.add('filled'); }
    closePicker();
  };

  function closePicker(){
    const el = document.getElementById('picker-overlay');
    if(el) el.remove();
    if(mapPicker){ try{ mapPicker.remove(); }catch(e){} mapPicker = null; }
    unlockBody();
  }

  setTimeout(()=>{ try{ mapPicker.invalidateSize(); }catch(e){} }, 150);
}

init();
</script>
